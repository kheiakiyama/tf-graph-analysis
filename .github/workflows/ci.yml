name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -v -race ./...

      - name: Build binary
        run: |
          go build -v -o tf-graph-analysis ./cmd/tf-graph-analysis
          echo "$(pwd)" >> $GITHUB_PATH

      - name: Test Action execution
        uses: ./
        with:
          dot-file: 'testdata/fixtures/sample_graph.dot'
          log-file: 'testdata/fixtures/sample_plan.log'
          pr-comment: 'false'
