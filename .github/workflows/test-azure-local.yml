name: Test - Pattern A (Azure Local Execution)

on:
  pull_request:
    paths:
      - 'action.yml'
      - 'scripts/**'
      - 'pkg/**'
      - 'cmd/**'
      - 'examples/modules/azure_network/**'
      - 'examples/azure-local/**'
      - '.github/workflows/test-azure-local.yml'
  workflow_dispatch:

jobs:
  test-local:
    name: Azure Local Plan & Analysis
    runs-on: ubuntu-latest
    # Prevent running on external forks without secrets
    if: ${{ !github.event.pull_request.head.repo.fork && secrets.AZURE_CLIENT_ID != '' }}
    permissions:
      id-token: write # Required for Azure OIDC authentication
      contents: read
      pull-requests: write # For PR comments if enabled

    defaults:
      run:
        working-directory: examples/azure-local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go & Build CLI
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Build tf-graph-analysis binary
        run: |
          go build -v -o tf-graph-analysis ../../cmd/tf-graph-analysis
          echo "$(pwd)" >> $GITHUB_PATH

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Mask Sensitive IDs
        run: |
          # Extra layer of security: Ensure Azure subscription ID is masked across all runner logs
          echo "::add-mask::${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Terraform Init & Plan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_OIDC: 'true'
        run: |
          terraform init
          terraform graph -type=plan > graph.dot
          # Capture plan TRACE log into file without leaking raw plan logs to stdout
          TF_LOG=TRACE terraform plan -no-color > tf_plan.log 2>&1 || true

      - name: Run tf-graph-analysis Action (Local Pattern)
        uses: ./
        with:
          working-directory: examples/azure-local
          dot-file: 'graph.dot'
          log-file: 'tf_plan.log'
          upload-html-report: 'true'
          title: 'Azure Network Local Test'
          pr-comment: ${{ github.event_name == 'pull_request' }}
